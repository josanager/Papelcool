<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F1L79TX6D6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-F1L79TX6D6');
  </script>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <script async defer src="https://js.whop.com/static/checkout/loader.js"></script>
  <style>
    div { box-sizing: border-box; }
    body { margin: 0; background: #050505 }
    /* Ensure the generated Whop iframe fills the viewport and can scroll internally */
    div[data-whop-checkout-plan-id] iframe {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 30px;
      height: 100vh; min-height: 100vh;
      height: 100dvh; min-height: 100dvh;
      height: 100svh; min-height: 100svh;
    }
  </style>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const presetCharacter = urlParams.get('preset') || 'mira';
    
    window.onWhopPaymentComplete = (planId, receiptId) => {
      // Redirigir a home tras suscripción exitosa
      window.location.href = `/?subscribed=true&preset=${presetCharacter}`;
    };
    
    // After Whop mounts the iframe, ensure it allows internal scrolling
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.querySelector('[data-whop-checkout-plan-id]');
      if (!root) return;
      const apply = () => {
        const iframe = root.querySelector('iframe');
        if (iframe) {
          iframe.setAttribute('scrolling', 'yes');
          iframe.style.overflow = 'auto';
        }
      };
      const observer = new MutationObserver(apply);
      observer.observe(root, { childList: true, subtree: true });
      apply();
    });
  </script>
</head>
<body>
  <div id="whop-wrapper" style="min-height: 100vh; min-height: 100dvh; min-height: 100svh; padding-block: 4vh; padding-block: 4dvh; padding-block: 4svh; box-sizing: border-box;">
    <div 
      data-whop-checkout-plan-id="plan_RU15lzvMLBOB3"
      data-whop-checkout-theme="dark"
      data-whop-checkout-theme-accent-color="cyan"
      data-whop-checkout-skip-redirect="true"
      data-whop-checkout-on-complete="onWhopPaymentComplete"
      style="height: fit-content; overflow: hidden;"
    ></div>
  </div>
</body>
</html>
