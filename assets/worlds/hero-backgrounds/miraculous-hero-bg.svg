<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2350 1000" role="img" aria-label="Moonlit city balcony background">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1754"/>
      <stop offset="45%" stop-color="#223091"/>
      <stop offset="100%" stop-color="#ff4770"/>
    </linearGradient>
    
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="14%" cy="18%" r="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- City buildings base gradient -->
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d174d"/>
      <stop offset="100%" stop-color="#0a0312"/>
    </linearGradient>
  </defs>

  <!-- Night Sky -->
  <rect width="2350" height="1000" fill="url(#sky)"/>
  <rect width="2350" height="1000" fill="url(#moonGlow)"/>

  <!-- Sticker Moon -->
  <!-- Shadow first -->
  <circle cx="300" cy="185" r="78" fill="#000" opacity="0.25" transform="translate(8, 8)"/>
  <!-- Moon Body -->
  <circle cx="300" cy="185" r="78" fill="#fffef2" stroke="#000" stroke-width="7"/>
  <circle cx="280" cy="170" r="62" fill="#fffbef"/>

  <!-- Floating Akuma (Butterflies) Silhouettes -->
  <g fill="#000" opacity="0.3" transform="translate(6, 6)">
    <!-- Akuma 1 -->
    <path d="M920 142 c-15-15-30 0-30 15 c0 15 15 15 30 0 c15 15 30 15 30 0 c0-15-15-30-30-15 Z"/>
    <!-- Akuma 2 -->
    <path d="M1700 122 c-15-15-30 0-30 15 c0 15 15 15 30 0 c15 15 30 15 30 0 c0-15-15-30-30-15 Z" transform="scale(0.8) translate(400, 50)"/>
  </g>
  <g fill="#FF4D94" stroke="#000" stroke-width="3" stroke-linejoin="miter">
    <!-- Akuma 1 -->
    <path d="M920 142 c-15-15-30 0-30 15 c0 15 15 15 30 0 c15 15 30 15 30 0 c0-15-15-30-30-15 Z"/>
    <path d="M920 142 L 920 152" stroke="#000" stroke-width="2"/>
    
    <!-- Akuma 2 -->
    <path d="M1700 122 c-15-15-30 0-30 15 c0 15 15 15 30 0 c15 15 30 15 30 0 c0-15-15-30-30-15 Z" transform="scale(0.8) translate(400, 50)"/>
  </g>

  <!-- Far City Skyline (Dark Purple silhouettes) -->
  <g fill="#432067" opacity="0.8">
    <path d="M0 820h180v-150h80v150h120v-210h90v210h110v-120h70v120h150v180H0Z"/>
    <path d="M760 820h120v-180h100v180h150v-250h110v250h110v-160h70v160h160v180H760Z"/>
    <path d="M1760 820h160v-145h80v145h130v-220h120v220h100v180h-590Z"/>
  </g>

  <!-- Eiffel Tower (Sticker Style with shadows) -->
  <!-- Shadow first -->
  <g fill="#000" opacity="0.25" transform="translate(8, 8)">
    <path d="M1565 360h44v368h-44Z"/>
    <path d="M1552 728h70l-35 34Z"/>
  </g>
  <!-- Eiffel Tower structure -->
  <g stroke="#000" stroke-width="6" stroke-linejoin="miter">
    <!-- Tower Legs -->
    <path d="M1552 728h70l-35 34Z" fill="#2d174d"/>
    <!-- Tower Body -->
    <path d="M1565 360h44v368h-44Z" fill="#3a224f"/>
  </g>
  <!-- Grid detail lines on Eiffel Tower (glowing yellow details) -->
  <g stroke="#FFE600" stroke-width="3" opacity="0.75">
    <line x1="1575" y1="380" x2="1595" y2="380"/>
    <line x1="1571" y1="440" x2="1603" y2="440"/>
    <line x1="1568" y1="520" x2="1606" y2="520"/>
    <line x1="1565" y1="620" x2="1609" y2="620"/>
    <!-- Diagonals -->
    <line x1="1565" y1="360" x2="1609" y2="728"/>
    <line x1="1609" y1="360" x2="1565" y2="728"/>
  </g>

  <!-- Midground City Hills (Rolling paths) -->
  <!-- Shadow first -->
  <path d="M-10 815c290-80 522-120 740-120 345 0 590 120 820 120 168 0 386-40 790-140v330H-10Z" fill="#000" opacity="0.25" transform="translate(0, 10)"/>
  <!-- Paths -->
  <path d="M0 810c290-80 522-120 740-120 345 0 590 120 820 120 168 0 386-40 790-140v330H0Z" fill="url(#city)" stroke="#000" stroke-width="7" stroke-linejoin="miter"/>

  <!-- Balcony Handrail/Railing (Foreground sticker details) -->
  <!-- Shadow first -->
  <g fill="none" stroke="#000" stroke-width="18" opacity="0.3" transform="translate(0, 8)">
    <path d="M80 835 320 930 590 845 860 930 1140 842 1450 930 1760 848 2070 930 2290 842"/>
  </g>
  <g fill="none" stroke="#0d0818" stroke-width="18">
    <path d="M80 835 320 930 590 845 860 930 1140 842 1450 930 1760 848 2070 930 2290 842"/>
  </g>
  <!-- Balcony Posts circles -->
  <g fill="#0d0818">
    <circle cx="320" cy="930" r="20"/>
    <circle cx="860" cy="930" r="20"/>
    <circle cx="1450" cy="930" r="20"/>
    <circle cx="2070" cy="930" r="20"/>
  </g>
  <!-- Balcony Posts highlights (pop art circles) -->
  <g fill="#FF4D94">
    <circle cx="320" cy="930" r="10"/>
    <circle cx="860" cy="930" r="10"/>
    <circle cx="1450" cy="930" r="10"/>
    <circle cx="2070" cy="930" r="10"/>
  </g>

  <!-- Foreground Floor Balcony edge -->
  <!-- Shadow first -->
  <path d="M0 900h2350v100H0Z" fill="#000" opacity="0.3" transform="translate(0, 8)"/>
  <!-- Floor edge -->
  <g fill="#07040d" stroke="#000" stroke-width="6" stroke-linejoin="miter">
    <path d="M0 900h2350v100H0Z"/>
    <path d="M0 875c260-20 500-52 718-52 299 0 585 76 842 76 254 0 484-58 790-79v24c-304 22-507 80-790 80-288 0-520-76-842-76-220 0-454 31-718 52Z" fill="#130822"/>
  </g>
</svg>
